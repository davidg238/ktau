# ktau #6: zephyr.Speech (c/speech) on the XIAO nRF54L15 with a MAX98357A (docs/hookup.md).
CONFIG_I2S=y
CONFIG_KTAU_SPEECH=y
# The firmware now carries the diphone table: its region ends where speech.overlay starts toit_partition.
CONFIG_FLASH_LOAD_SIZE=0x138000

# Not speech, but this firmware's only conf: restart on a fatal error instead of halting. The nRF 802.15.4
# driver asserts now and then while the board polls its Thread parent (ktau #7); the dump still prints.
CONFIG_RESET_ON_FATAL_ERROR=y
